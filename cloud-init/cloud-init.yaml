#cloud-config
# Primer arranque de la EC2 de un tenant.
# Variables que reemplaza el motor de IaC:
#   TenantId, Entorno, Plan, Region, SsmPrefijo, VolumenDatos, AppRepoUrl, AppVersion,
#   DemoData, MaxEstudiantes, MaxDocentes, MaxCursos, InstitucionB64
# El nombre de la institución llega en base64: así tildes, comillas o símbolos no rompen el script.
# Ningún secreto viaja en este archivo: la clave del panel se lee de SSM con el rol de la instancia.
# Nota: en las plantillas de Terraform, "$${...}" es una variable de shell y no de la plantilla.
# Los paquetes (Node.js, git, node_exporter...) ya vienen en la AMI de Packer.
# Si la instancia arranca con Amazon Linux 2023 sin preparar, el script los instala.

write_files:
  - path: /usr/local/bin/asistencia-preparar.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      set -euo pipefail

      # 0) Sin AMI de Packer: instalar lo mínimo (sin node_exporter no habrá métricas)
      if ! command -v node >/dev/null 2>&1; then
        dnf -y install git nodejs npm gcc-c++ make python3 xfsprogs
      fi

      # 1) Volumen de datos del tenant: esperar a que se adjunte, formatear solo si está vacío, montar
      # Terraform pasa el id del volumen. CloudFormation no lo conoce al generar el user data
      # (el volumen nace en el mismo stack): entonces se usa /dev/sdf, el nombre con el que se
      # adjunta; en Amazon Linux 2023 udev crea ese alias para el disco NVMe.
      VOL_ID="${VolumenDatos}"
      if [ -n "$VOL_ID" ]; then DEV="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$${VOL_ID/-/}"; else DEV=/dev/sdf; fi
      for i in $(seq 1 60); do [ -e "$DEV" ] && break; echo "Esperando el volumen de datos $DEV ($i)"; sleep 5; done
      DEV=$(readlink -f "$DEV") # blkid y mkfs sobre el dispositivo real, no sobre el alias
      [ -e "$DEV" ] || { echo "El volumen de datos no se adjuntó"; exit 1; }
      if ! blkid "$DEV" >/dev/null 2>&1; then
        mkfs.xfs -L asist-datos "$DEV" # XFS: etiqueta de máx. 12 caracteres
      fi
      mkdir -p /var/lib/asistencia
      UUID=$(blkid -s UUID -o value "$DEV")
      grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /var/lib/asistencia xfs defaults,nofail 0 2" >> /etc/fstab
      mountpoint -q /var/lib/asistencia || mount /var/lib/asistencia

      # 2) Secreto del tenant desde SSM (reintenta mientras se propaga el rol IAM)
      for i in $(seq 1 30); do
        ADMIN_KEY=$(aws ssm get-parameter --region "${Region}" --with-decryption \
          --name "${SsmPrefijo}/admin-key" --query Parameter.Value --output text 2>/dev/null) && break
        echo "Esperando acceso a SSM ($i)"; sleep 5
      done
      [ -n "$${ADMIN_KEY:-}" ] || { echo "No se pudo leer la clave desde SSM"; exit 1; }

      # 3) Configuración de la app
      # Nombre de la institución: sin caracteres de control, comillas ni barras (formato de EnvironmentFile)
      INSTITUCION=$(echo '${InstitucionB64}' | base64 -d | tr -d '\000-\037"\\' | sed "s/'/’/g" | cut -c1-120)
      umask 077
      cat > /etc/asistencia.env <<EOF
      PORT=80
      METRICS_PORT=9101
      API_URL=
      CORS_ORIGIN=*
      DB_PATH=/var/lib/asistencia/asistencia.db
      ADMIN_KEY=$ADMIN_KEY
      TZ_APP=America/La_Paz
      VALIDAR_HORARIO=false
      TOLERANCIA_MIN=15
      ANTICIPO_MIN=30
      DEMO_DATA=${DemoData}
      AMBIENTE=${Entorno}
      TENANT_ID=${TenantId}
      INSTITUCION=$INSTITUCION
      PLAN=${Plan}
      MAX_ESTUDIANTES=${MaxEstudiantes}
      MAX_DOCENTES=${MaxDocentes}
      MAX_CURSOS=${MaxCursos}
      EOF

      # 4) App en la versión pedida (solo backend/ y frontend/)
      if [ ! -d /opt/asistencia/.git ]; then
        git clone --depth 1 --filter=blob:none --sparse --branch "${AppVersion}" "${AppRepoUrl}" /opt/asistencia
        git -C /opt/asistencia sparse-checkout set backend frontend
      fi
      cd /opt/asistencia/backend && npm ci --omit=dev
      git -C /opt/asistencia rev-parse HEAD > /etc/asistencia.commit

  - path: /etc/systemd/system/asistencia.service
    content: |
      [Unit]
      Description=Sistema de Asistencia - tenant ${TenantId}
      After=network-online.target
      Wants=network-online.target
      RequiresMountsFor=/var/lib/asistencia

      [Service]
      EnvironmentFile=/etc/asistencia.env
      WorkingDirectory=/opt/asistencia/backend
      ExecStart=/usr/bin/node server.js
      Restart=always

      [Install]
      WantedBy=multi-user.target

runcmd:
  - /usr/local/bin/asistencia-preparar.sh
  - systemctl daemon-reload
  - systemctl enable --now asistencia
